<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JM 공장 · Isaac Sim</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10151d;color:#e9edf3;font:14px system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 22px;border-bottom:1px solid #303b4c}
strong{font-size:17px;margin-right:14px}button{background:#263549;color:#f2f6fc;border:1px solid #49627e;border-radius:6px;padding:9px 15px;cursor:pointer}button:hover{background:#38516c}
#status{margin-left:auto;color:#9bb3cf}main{max-width:1644px;margin:auto;padding:18px 22px}canvas{display:block;width:100%;height:auto;background:#1c2530;border:1px solid #364458;border-radius:5px;outline:none;touch-action:none}canvas:focus{border-color:#79baff}p{line-height:1.65;color:#adbdce;margin:10px 0}.hint{color:#d9e7f7}
</style>
<header><strong>JM 공장 · Isaac Sim</strong><button data-view="factory_aisle">설비와 로봇</button><button data-view="factory_top">공장 전체</button><button data-view="h1_close">H1 가까이 보기</button><button data-view="task1_pcb">PCB 파지 후보</button><a href="/task1/" target="_blank" rel="noopener" style="color:#9ccaff">Task 1 실험 결과 ↗</a><button id="fullscreen">전체 화면</button><span id="status">화면 연결 중…</span></header>
<main><canvas id="screen" width="1600" height="900" tabindex="0" aria-label="Isaac Sim 원격 화면"></canvas>
<p class="hint">화면 안을 클릭한 뒤 조작하세요. 휠: 확대·축소 · Alt + 왼쪽 드래그: 회전 · 가운데 드래그: 이동 · 오른쪽 버튼을 누른 채 W/A/S/D: 시점 이동</p>
<p>‘PCB 파지 후보’는 GraspGen-X가 제안한 임시 그리퍼 위치를 보여줍니다. 파란 그리퍼는 최고 점수 후보이며 H1에 장착된 손이 아닙니다. 로봇의 보행·파지 실행은 아직 구현되지 않았습니다.</p></main>
<script>
const token='__TOKEN__',screen=document.getElementById('screen'),ctx=screen.getContext('2d'),status=document.getElementById('status');
let pending=[],sending=false,failed=false,lastMove=0;
const modifiers=e=>(e.shiftKey?1:0)|(e.ctrlKey?2:0)|(e.altKey?4:0)|(e.metaKey?8:0);
function send(e){pending.push(e)}
setInterval(async()=>{if(sending||!pending.length)return;sending=true;const batch=pending.splice(0,128);try{const r=await fetch('/input',{method:'POST',headers:{'Content-Type':'application/json','X-Factor-Token':token},body:JSON.stringify(batch)});if(!r.ok)throw new Error('input')}catch{status.textContent='입력 연결을 확인하세요'}finally{sending=false}},33);
async function frames(){while(true){try{if(!document.hidden){const r=await fetch('/frame.jpg',{cache:'no-store'});if(!r.ok)throw new Error('loading');const bmp=await createImageBitmap(await r.blob());ctx.drawImage(bmp,0,0,screen.width,screen.height);bmp.close();status.textContent='연결됨 · 실제 Isaac Sim 화면';failed=false}}catch{status.textContent='화면 준비 중 또는 연결 끊김';failed=true}await new Promise(r=>setTimeout(r,failed?1000:120))}}
function mouse(e,action){const b=screen.getBoundingClientRect();send({kind:'mouse',action,button:e.button,x:(e.clientX-b.left)*1600/b.width,y:(e.clientY-b.top)*900/b.height,mods:modifiers(e)})}
screen.addEventListener('pointerdown',e=>{e.preventDefault();screen.focus();screen.setPointerCapture(e.pointerId);mouse(e,'down')});
screen.addEventListener('pointerup',e=>{e.preventDefault();mouse(e,'up');screen.releasePointerCapture(e.pointerId)});
screen.addEventListener('pointermove',e=>{if(performance.now()-lastMove<45)return;lastMove=performance.now();mouse(e,'move')});
screen.addEventListener('pointercancel',()=>send({kind:'release'}));screen.addEventListener('contextmenu',e=>e.preventDefault());
screen.addEventListener('wheel',e=>{e.preventDefault();send({kind:'wheel',delta:-Math.sign(e.deltaY),mods:modifiers(e)})},{passive:false});
const keys={Space:'SPACE',Escape:'ESCAPE',Enter:'ENTER',Tab:'TAB',Backspace:'BACKSPACE',Delete:'DELETE',Insert:'INSERT',Home:'HOME',End:'END',PageUp:'PAGE_UP',PageDown:'PAGE_DOWN',ArrowLeft:'LEFT',ArrowRight:'RIGHT',ArrowUp:'UP',ArrowDown:'DOWN',ShiftLeft:'LEFT_SHIFT',ShiftRight:'RIGHT_SHIFT',ControlLeft:'LEFT_CONTROL',ControlRight:'RIGHT_CONTROL',AltLeft:'LEFT_ALT',AltRight:'RIGHT_ALT',MetaLeft:'LEFT_SUPER',MetaRight:'RIGHT_SUPER',Minus:'MINUS',Equal:'EQUAL',Period:'PERIOD',Comma:'COMMA',Slash:'SLASH',Backslash:'BACKSLASH',BracketLeft:'LEFT_BRACKET',BracketRight:'RIGHT_BRACKET',Semicolon:'SEMICOLON',Quote:'APOSTROPHE',Backquote:'GRAVE_ACCENT'};
function key(e,down){if(e.repeat)return;const code=keys[e.code]||(/^Key[A-Z]$/.test(e.code)?e.code.slice(3):/^Digit[0-9]$/.test(e.code)?'KEY_'+e.code.slice(5):/^F[0-9]+$/.test(e.code)?e.code:null);if(code){e.preventDefault();send({kind:'key',code,down,char:down&&e.key.length===1?e.key:'',mods:modifiers(e)})}}
screen.addEventListener('keydown',e=>key(e,true));screen.addEventListener('keyup',e=>key(e,false));
screen.addEventListener('blur',()=>send({kind:'release'}));window.addEventListener('blur',()=>send({kind:'release'}));document.addEventListener('visibilitychange',()=>{if(document.hidden)send({kind:'release'})});
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{send({kind:'view',name:b.dataset.view});screen.focus()});
document.getElementById('fullscreen').onclick=()=>screen.requestFullscreen();
frames();
</script></html>
